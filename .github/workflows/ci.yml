name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-gate:
    name: Tests and quality gate (offline TF-IDF)
    runs-on: ubuntu-latest
    env:
      EMBEDDING_BACKEND: tfidf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - run: pytest
      - run: sh scripts/train_all.sh
      - run: python eval/check_gate.py --model-dir artifacts/robust
      - name: Write results to the job summary
        if: always()
        run: |
          echo "## TF-IDF results" >> "$GITHUB_STEP_SUMMARY"
          python eval/summary.py artifacts/robust >> "$GITHUB_STEP_SUMMARY"
          cat reports/robustness.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-tfidf
          path: |
            artifacts/*/metrics.json
            artifacts/*/robustness.json
            artifacts/robust/retrieval.json
            artifacts/robust/extraction_rules.json
            reports/

  sbert:
    name: Full pipeline with MiniLM embeddings
    runs-on: ubuntu-latest
    needs: test-and-gate
    env:
      EMBEDDING_BACKEND: sbert
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements-sbert.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-v1
      - run: sh scripts/train_all.sh
      - run: python eval/check_gate.py --model-dir artifacts/robust
      - name: Write results to the job summary
        if: always()
        run: |
          echo "## MiniLM (sbert) results" >> "$GITHUB_STEP_SUMMARY"
          python eval/summary.py artifacts/robust >> "$GITHUB_STEP_SUMMARY"
          cat reports/robustness.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-sbert
          path: |
            artifacts/*/metrics.json
            artifacts/*/robustness.json
            artifacts/robust/retrieval.json
            artifacts/robust/extraction_rules.json
            reports/

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test-and-gate
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg INSTALL_SBERT=false -t comms-triage:ci .
      - run: docker run --rm -e EMBEDDING_BACKEND=tfidf comms-triage:ci sh -c "pytest -q"
