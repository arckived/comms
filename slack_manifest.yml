# Paste this at https://api.slack.com/apps -> Create New App -> From a manifest
display_information:
  name: Comms Triage
  description: Routes communications requests to the right team
  background_color: "#2c2d30"
features:
  bot_user:
    display_name: Comms Triage
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:read
      - chat:write
      - groups:history
      - groups:read
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
